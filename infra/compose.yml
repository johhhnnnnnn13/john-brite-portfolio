services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: portfolio
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-portfolio}
    volumes:
      - portfolio-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfolio -d portfolio"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ..
      dockerfile: infra/docker/backend.Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DATABASE_URL: jdbc:postgresql://db:5432/portfolio
      DATABASE_USERNAME: portfolio
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-portfolio}
      FRONTEND_ORIGIN: http://localhost:4173
    ports: ["8080:8080"]
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ..
      dockerfile: infra/docker/frontend.Dockerfile
      args:
        VITE_API_URL: http://localhost:8080
    ports: ["4173:80"]
    depends_on: [backend]

volumes:
  portfolio-data:
